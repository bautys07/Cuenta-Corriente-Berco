:root[data-theme="dark"]{--bg:#150d0e;--card:#211617;--tx:#f8eeee;--mut:#b39c9c;--ln:#3a2628;--ac:#ff6b7a;--acx:#2a0a0e;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shh:0 2px 4px rgba(0,0,0,.5),0 16px 36px rgba(0,0,0,.5);color-scheme:dark}
body::before{background:radial-gradient(600px 420px at 100% 0,color-mix(in srgb,#e5384f 14%,transparent),transparent 70%),radial-gradient(520px 420px at 0 100%,color-mix(in srgb,#f5a524 9%,transparent),transparent 70%)}
.logo{background:linear-gradient(135deg,#e5384f,#a30f25);box-shadow:0 8px 18px rgba(179,18,42,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.hero{background:linear-gradient(145deg,#2a0d12 0%,#5a1420 55%,#8f1d2e 125%);box-shadow:0 22px 50px rgba(70,10,20,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.o1{background:#ff4d63;opacity:.55}
.o2{background:#f5a524;opacity:.28}
.btn,.fab,.seg button.on{background:linear-gradient(135deg,#e5384f,#a30f25);color:#fff}

.btn.sec{background:transparent;box-shadow:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card.pre{opacity:1;transform:none}}

#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}#login.hide{display:none}#login input{width:100%;box-sizing:border-box;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:10px;margin:6px 0;background:var(--card);color:var(--tx)}</style>

<body class="sindb">
<div id="login" class="hide"><div class="card" style="width:100%;max-width:360px"><h1 style="margin:0 0 8px;font-size:22px">🥖 Cuenta corriente</h1><div id="lmsg" style="color:var(--debe);min-height:20px"></div><input id="lc" type="email" placeholder="Correo" autocomplete="username"><input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn" id="lok" style="width:100%;margin-top:6px">Ingresar</button></div></div>
<div class="w">
  <div class="brand"><span class="logo" aria-hidden="true">🥖</span><h1>Cuenta corriente</h1></div>
  <div class="sub">Todo se guarda solo, en cada cambio.</div>
  <div id="aviso" class="aviso hide"></div><div id="rec" class="rec hide"></div>
  <div class="hero"><i class="orb o1"></i><i class="orb o2"></i><div class="hl">Total que te deben</div><b id="total" class="big">$0</b><div class="chips"><span class="chip"><i class="dot"></i><span><span id="cant">0</span> con deuda</span></span><span class="chip"><i class="dot g"></i><span id="gtxt">Guardado automático</span></span></div></div>
  <div id="venc" class="venc hide"></div>
  <div class="row"><input id="buscar" placeholder="Buscar por nombre o teléfono" autocomplete="off"></div>
  <div class="seg" id="orden"><button data-o="deuda">Mayor deuda ↓</button><button data-o="az">A–Z</button></div>
  <button class="fab" id="nuevo">+ Nuevo cliente</button><div class="row"><button class="btn sec sm" id="resp">⬇ Descargar respaldo</button> <button class="btn sec sm" id="salir">Salir</button></div>
  <div id="form" class="card hide">
    <input id="fn" placeholder="Nombre" autocomplete="off">
    <div class="row"><input id="ft" placeholder="Teléfono" inputmode="tel" autocomplete="off"></div>
    <div class="row"><button class="btn" id="gc">Guardar cliente</button><button class="btn sec" id="cc">Cancelar</button></div>
  </div>
  <div id="lista"></div>
  <div class="est" id="est"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  var db=null,clientes=[],abierto=null,coleccion=null,editando=null,armado=null,ultimoResp=null,metaLista=false;
  function armar(k){armado=k;render();setTimeout(function(){if(armado===k){armado=null;render()}},3500)}
  function qa(s){return esc(s).replace(/"/g,'&quot;')}
  function hh(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
  function gtxt(t){var g=document.getElementById('gtxt');if(g)g.textContent=t}
  function okGuardado(){estado('Guardado ✓');gtxt('Guardado '+hh());document.getElementById('aviso').classList.add('hide')}
  function pintarRec(){
    var el=document.getElementById('rec');if(!el)return;
    if(!metaLista||!clientes.length){el.classList.add('hide');return}
    var dias=ultimoResp?Math.floor((Date.now()-ultimoResp)/864e5):null;
    if(dias!==null&&dias<2){el.classList.add('hide');return}
    el.innerHTML='<span>'+(dias===null?'Todavía no descargaste ningún respaldo.':'Hace '+dias+' días que no descargás el respaldo.')+'</span><button class="btn sm" data-rb="1">Descargar ahora</button>';
    el.classList.remove('hide');
  }
  var vencAbierto=null;
  function fechaElegida(id){var fi=document.querySelector('[data-f="'+id+'"]'),v=fi&&fi.value;if(!v)return Date.now();var t=new Date(v+'T12:00:00').getTime();return isNaN(t)||t>Date.now()?Date.now():t}
  function vencido(c){
    var ms=(c.movimientos||[]).slice().sort(function(a,b){return a.fecha-b.fecha}),q=[],cred=0;
    ms.forEach(function(m){
      if(m.tipo==='compra'){var r=m.monto;if(cred>0){var u=Math.min(cred,r);cred-=u;r-=u}if(r>0)q.push({f:m.fecha,r:r})}
      else{var p=m.monto;while(p>0&&q.length){var u2=Math.min(p,q[0].r);q[0].r-=u2;p-=u2;if(q[0].r<=0.0001)q.shift()}if(p>0)cred+=p}
    });
    var lim=Date.now()-30*864e5,sum=0,desde=null;
    q.forEach(function(x){if(x.f<lim&&x.r>0.005){sum+=x.r;if(desde===null||x.f<desde)desde=x.f}});
    return sum>0?{monto:sum,desde:desde,dias:Math.floor((Date.now()-desde)/864e5)}:null;
  }
  function vtag(c){var v=vencido(c);return v?'<div class="vtag">⚠ Vencido: '+peso(v.monto)+' desde el '+fechaCorta(v.desde)+'</div>':''}
  function pintarVenc(){
    var el=document.getElementById('venc');if(!el)return;
    var l=[];clientes.forEach(function(c){var v=vencido(c);if(v)l.push({c:c,v:v})});
    if(!l.length){el.classList.add('hide');el.innerHTML='';return}
    l.sort(function(a,b){return a.v.desde-b.v.desde});
    var tot=l.reduce(function(a,x){return a+x.v.monto},0),ab=vencAbierto===null?l.length<=5:vencAbierto;
    el.innerHTML='<details'+(ab?' open':'')+'><summary>⚠ '+l.length+(l.length===1?' cliente con deuda':' clientes con deuda')+' de más de 30 días · '+peso(tot)+'</summary><ul>'+l.map(function(x){return '<li data-vid="'+esc(x.c.id)+'"><b>'+esc(x.c.nombre)+'</b> debe <b>'+peso(x.v.monto)+'</b> desde el '+fechaCorta(x.v.desde)+' <span class="tel">('+x.v.dias+' días)</span></li>'}).join('')+'</ul></details>';
    el.classList.remove('hide');
  }
  var rango={id:null,d:'',h:''};
  function hojaRango(c,d1,d2){
    var t1=d1?new Date(d1+'T00:00:00').getTime():null,t2=d2?new Date(d2+'T23:59:59.999').getTime():null;
    var ms=(c.movimientos||[]).slice().sort(function(a,b){return a.fecha-b.fecha}),acc=0,previo=0,llevo=0,pago=0,filas='';
    ms.forEach(function(m){
      var v=m.tipo==='compra'?m.monto:-m.monto;
      if(t1!==null&&m.fecha<t1){previo+=v;acc+=v;return}
      if(t2!==null&&m.fecha>t2)return;
      acc+=v;if(m.tipo==='compra')llevo+=m.monto;else pago+=m.monto;
      filas+='<tr><td>'+fechaCorta(m.fecha)+'</td><td>'+esc(m.nota||'')+'</td><td>'+(m.tipo==='compra'?'Llevó':'Pagó')+'</td><td class="n">'+(m.tipo==='compra'?'':'−')+peso(m.monto)+'</td><td class="n">'+peso(acc)+'</td></tr>';
    });
    var ini=t1!==null?'<tr><td></td><td colspan="2"><b>Saldo anterior al período</b></td><td class="n"></td><td class="n"><b>'+peso(previo)+'</b></td></tr>':'';
    var per=t1!==null&&t2!==null?'Período: '+fechaCorta(t1)+' al '+fechaCorta(t2):t1!==null?'Desde el '+fechaCorta(t1):t2!==null?'Hasta el '+fechaCorta(t2):'Todos los movimientos';
    var etiqueta=t2!==null?'Saldo al '+fechaCorta(t2):'Saldo pendiente';
    var tot=acc>0?etiqueta+': '+peso(acc):acc<0?'Saldo a favor: '+peso(-acc):'Cuenta al día';
    var res=(t1!==null||t2!==null)?'<div class="meta" style="margin:14px 0 0;text-align:right">Llevó en el período: '+peso(llevo)+' · Pagó: '+peso(pago)+'</div>':'';
    return '<div class="hoja"><h2>Estado de cuenta</h2><div class="meta"><b>'+esc(c.nombre)+'</b>'+(c.telefono?' · Tel. '+esc(c.telefono):'')+'<br>'+per+'<br>Emitido el '+fechaCorta(Date.now())+'</div><table><thead><tr><th>Fecha</th><th>Detalle</th><th>Tipo</th><th class="n">Monto</th><th class="n">Saldo</th></tr></thead><tbody>'+ini+(filas||'<tr><td colspan="5">Sin movimientos en este período.</td></tr>')+'</tbody></table>'+res+'<div class="tot">'+tot+'</div></div>';
  }
  function marcarRespaldo(){var t=Date.now();ultimoResp=t;pintarRec();if(db)db.collection('meta').doc('respaldo').set({ultimo:t}).catch(function(){})}
  var $=function(i){return document.getElementById(i)};
  var color=function(s){var h=0;s=s||'';for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return 'linear-gradient(135deg,hsl('+h+',78%,58%),hsl('+((h+55)%360)+',78%,42%))'};
  var peso=function(n){return '$'+Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:2})};
  var saldo=function(c){return (c.movimientos||[]).reduce(function(a,m){return a+(m.tipo==='compra'?m.monto:-m.monto)},0)};
  function contar(el,to,fmt){var from=el._v||0;el._v=to;if(from===to||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=fmt(to);return}var t0=performance.now();(function f(t){var p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(f)})(t0)}
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
  function estado(t){$('est').textContent=t}
  function aviso(t){var a=$('aviso');a.textContent=t;a.classList.remove('hide')}

  function render(){
    var q=$('buscar').value.trim().toLowerCase();
    var vis=clientes.filter(function(c){return !q||(c.nombre||'').toLowerCase().indexOf(q)>=0||(c.telefono||'').indexOf(q)>=0});
    vis.sort(function(a,b){var an=(a.nombre||'').localeCompare(b.nombre||'','es',{sensitivity:'base'});return orden==='az'?an:(saldo(b)-saldo(a))||an});
    var tot=clientes.reduce(function(a,c){var s=saldo(c);return a+(s>0?s:0)},0);
    pintarRec();pintarVenc();contar($('total'),tot,peso);contar($('cant'),clientes.filter(function(c){return saldo(c)>0}).length,function(n){return String(Math.round(n))});
    if(!vis.length){$('lista').innerHTML='<div class="vac">'+(clientes.length?'Sin resultados.':'Todavía no hay clientes. Tocá “Nuevo cliente”.')+'</div>';return}
    $('lista').innerHTML=vis.map(function(c){
      var s=saldo(c),open=abierto===c.id;
      var h='<div class="card" data-id="'+esc(c.id)+'"><div class="top" data-t="'+esc(c.id)+'"><div class="av" style="background:'+color(c.nombre)+'">'+esc((c.nombre||'?').trim().charAt(0).toUpperCase())+'</div><div class="who"><div class="nom">'+esc(c.nombre)+'</div><div class="tel">'+esc(c.telefono||'Sin teléfono')+'</div>'+vtag(c)+'</div><div class="sal '+(s>0?'debe':'ok')+'">'+(s>0?'Debe '+peso(s):s<0?'A favor '+peso(-s):'Al día')+'</div></div>';
      if(open){
        h+='<div class="det"><div class="row"><input data-m="'+esc(c.id)+'" placeholder="Monto" inputmode="decimal"></div><div class="row"><input data-n="'+esc(c.id)+'" placeholder="Detalle (opcional)"></div><div class="row fecha"><label>Fecha (opcional; si no la cambiás, es hoy)</label><input type="date" data-f="'+esc(c.id)+'"></div><div class="row"><button class="btn sm" data-a="compra" data-c="'+esc(c.id)+'">Llevó (suma)</button><button class="btn sm sec" data-a="pago" data-c="'+esc(c.id)+'">Pagó (resta)</button></div>';
        var ms=(c.movimientos||[]).slice().reverse();
        h+=ms.length?ms.map(function(m){return '<div class="mov"><div>'+(m.tipo==='compra'?'Llevó':'Pagó')+(m.nota?' · '+esc(m.nota):'')+'<small>'+esc(new Date(m.fecha).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}))+'</small></div><div class="'+(m.tipo==='compra'?'debe':'ok')+'">'+(m.tipo==='compra'?'+':'−')+peso(m.monto)+' <button class="x" data-dm="'+esc(m.id)+'" data-c="'+esc(c.id)+'" title="Borrar">'+(armado==='m'+m.id?'¿Borrar?':'✕')+'</button></div></div>'}).join(''):'<div class="tel">Sin movimientos.</div>';
        h+='<div class="rtit">Hoja para imprimir</div><div class="row rango"><div><label>Desde (opcional)</label><input type="date" data-d="'+esc(c.id)+'" value="'+(rango.id===c.id?rango.d:'')+'"></div><div><label>Hasta (opcional)</label><input type="date" data-h="'+esc(c.id)+'" value="'+(rango.id===c.id?rango.h:'')+'"></div></div><div class="row" style="flex-wrap:wrap"><button class="btn sm sec" data-hd="'+esc(c.id)+'">⬇ Descargar hoja</button></div>';
        if(editando===c.id){h+='<div class="row"><input data-en="'+esc(c.id)+'" value="'+qa(c.nombre)+'" placeholder="Nombre"></div><div class="row"><input data-et="'+esc(c.id)+'" value="'+qa(c.telefono||'')+'" placeholder="Teléfono" inputmode="tel"></div><div class="row"><button class="btn sm" data-es="'+esc(c.id)+'">Guardar cambios</button><button class="btn sm sec" data-ex="1">Cancelar</button></div></div>'}
        else{h+='<div class="row"><button class="btn sm sec" data-ec="'+esc(c.id)+'">Editar datos</button><button class="btn sm sec" data-bc="'+esc(c.id)+'">'+(armado==='c'+c.id?'¿Seguro? Tocá de nuevo':'Borrar cliente')+'</button></div></div>'}
      }
      return h+'</div>';
    }).join('');
  }

  function guardar(c){
    estado('Guardando…');
    gtxt('Guardando…');var tm=setTimeout(function(){gtxt('⚠ Sin confirmar');aviso('Está tardando en guardar. Revisá tu conexión y no cierres la página hasta ver Guardado ✓.')},8000);return enCola(c.id,function(){if(!coleccion)throw {message:'sin conexión con la base de datos'};var u=buscarCliente(c.id);if(!u)return;return coleccion.doc(c.id).set({nombre:u.nombre,telefono:u.telefono||'',movimientos:u.movimientos||[]})}).then(function(){clearTimeout(tm);okGuardado()},function(e){clearTimeout(tm);estado('');gtxt('⚠ Sin guardar');aviso('No se pudo guardar: '+(e&&e.message||'error')+'. Si abriste el enlace desde otra cuenta, pedí permiso de edición.');resync()});
  }
  function buscarCliente(id){return clientes.filter(function(c){return c.id===id})[0]}
  var HOJA_CSS='.hoja{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111;background:#fff;max-width:760px;margin:0 auto;padding:24px}.hoja h2{margin:0 0 6px;font-size:22px}.hoja .meta{color:#444;margin-bottom:18px}.hoja table{width:100%;border-collapse:collapse}.hoja th,.hoja td{padding:7px 8px;border-bottom:1px solid #ccc;text-align:left;vertical-align:top}.hoja th{border-bottom:2px solid #111;font-size:11px;text-transform:uppercase;letter-spacing:.05em}.hoja .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.hoja .tot{margin-top:18px;text-align:right;font-size:18px;font-weight:700}';
  function fechaCorta(t){return new Date(t).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})}
  function hoja(c){
    var ms=(c.movimientos||[]).slice().sort(function(a,b){return a.fecha-b.fecha}),acc=0,s=saldo(c);
    var filas=ms.map(function(m){acc+=m.tipo==='compra'?m.monto:-m.monto;return '<tr><td>'+fechaCorta(m.fecha)+'</td><td>'+esc(m.nota||'')+'</td><td>'+(m.tipo==='compra'?'Llevó':'Pagó')+'</td><td class="n">'+(m.tipo==='compra'?'':'−')+peso(m.monto)+'</td><td class="n">'+peso(acc)+'</td></tr>'}).join('');
    return '<div class="hoja"><h2>Estado de cuenta</h2><div class="meta"><b>'+esc(c.nombre)+'</b>'+(c.telefono?' · Tel. '+esc(c.telefono):'')+'<br>Emitido el '+fechaCorta(Date.now())+'</div><table><thead><tr><th>Fecha</th><th>Detalle</th><th>Tipo</th><th class="n">Monto</th><th class="n">Saldo</th></tr></thead><tbody>'+(filas||'<tr><td colspan="5">Sin movimientos.</td></tr>')+'</tbody></table><div class="tot">'+(s>0?'Saldo pendiente: '+peso(s):s<0?'Saldo a favor: '+peso(-s):'Cuenta al día')+'</div></div>';
  }
  var imp=document.createElement('div');imp.id='imp';document.body.appendChild(imp);
  var stp=document.createElement('style');stp.textContent=HOJA_CSS+'#imp{display:none}@media print{body>*:not(#imp){display:none!important}body::before{display:none!important}html,body{background:#fff!important}:root{padding:0!important}#imp{display:block!important}.hoja{padding:0}tr{break-inside:avoid}@page{margin:14mm}}';document.head.appendChild(stp);
  function bajarHoja(c,d1,d2){
    Promise.resolve(DL).then(function(dl){
      if(!dl){aviso('La descarga no está disponible en esta vista.');return}
      var html='<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Estado de cuenta - '+esc(c.nombre)+'</title><style>'+HOJA_CSS+'@page{margin:14mm}@media print{.hoja{padding:0}}</style></head><body>'+hojaRango(c,d1,d2)+'<script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script></body></html>';
      var nom=(c.nombre||'cliente').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'cliente';
      return dl.save({filename:'estado-de-cuenta-'+nom+'.html',data:html}).then(function(){estado('Hoja descargada ✓')});
    }).catch(function(e){if(e&&e.code==='declined')return;aviso('No se pudo descargar la hoja.')});
  }
  var cola={};
  function enCola(id,fn){var p=(cola[id]||Promise.resolve()).then(fn);cola[id]=p.catch(function(){});return p}
  function resync(){if(!coleccion)return;coleccion.get().then(function(s){clientes=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});render()})}

  var orden='deuda';try{orden=localStorage.getItem('orden-clientes')==='az'?'az':'deuda'}catch(x){}
  function pintarOrden(){Array.prototype.forEach.call(document.querySelectorAll('#orden button'),function(b){b.classList.toggle('on',b.dataset.o===orden)})}
  pintarOrden();
  $('venc').addEventListener('click',function(e){
    var sm=e.target.closest('summary'),d=el_d();if(sm){vencAbierto=!d.open;return}
    var li=e.target.closest('[data-vid]');if(!li)return;
    abierto=li.dataset.vid;$('buscar').value='';render();
    var card=document.querySelector('.card[data-id="'+abierto+'"]');if(card)card.scrollIntoView({behavior:'smooth',block:'center'});
    function el_d(){return $('venc').querySelector('details')}
  });
  $('lista').addEventListener('change',function(e){var t=e.target,id=t.dataset&&(t.dataset.d||t.dataset.h);if(!id)return;if(rango.id!==id)rango={id:id,d:'',h:''};if(t.dataset.d)rango.d=t.value;else rango.h=t.value});
  $('orden').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;orden=b.dataset.o==='az'?'az':'deuda';try{localStorage.setItem('orden-clientes',orden)}catch(x){}pintarOrden();render()});
  $('rec').addEventListener('click',function(e){if(e.target.closest('[data-rb]'))$('resp').click()});
  $('buscar').addEventListener('input',render);
  var revelado=false;
  new MutationObserver(function(){
    if(revelado)return;
    var cs=$('lista').querySelectorAll('.card');
    if(!cs.length)return;
    revelado=true;
    if(!('IntersectionObserver' in window))return;
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var c=e.target;c.classList.add('in');io.unobserve(c);setTimeout(function(){c.classList.remove('pre','in');c.style.removeProperty('--d')},1400)}})},{threshold:.08});
    cs.forEach(function(c,i){c.style.setProperty('--d',Math.min(i,8)*55+'ms');c.classList.add('pre');io.observe(c)});
  }).observe($('lista'),{childList:true});
  $('nuevo').onclick=function(){$('form').classList.remove('hide');$('form').scrollIntoView({behavior:'smooth',block:'center'});$('fn').focus()};
  $('resp').onclick=function(){
    if(!clientes.length){estado('No hay datos para respaldar.');return}
    Promise.resolve(DL).then(function(dl){
      if(!dl){aviso('La descarga no está disponible en esta vista.');return}
      var rows=[['Cliente','Teléfono','Fecha','Tipo','Monto','Detalle','Saldo del cliente']];
      clientes.forEach(function(c){var ms=c.movimientos||[];if(!ms.length)rows.push([c.nombre,c.telefono,'','','','',saldo(c)]);ms.forEach(function(m){rows.push([c.nombre,c.telefono,new Date(m.fecha).toLocaleString('es-AR'),m.tipo==='compra'?'Llevó':'Pagó',m.monto,m.nota||'',saldo(c)])})});
      var csv='\ufeff'+rows.map(function(r){return r.map(function(v){v=v==null?'':String(v);return '"'+v.replace(/"/g,'""')+'"'}).join(';')}).join('\r\n');
      var d=new Date(),f='respaldo-cuenta-corriente-'+d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+'.csv';
      return dl.save({filename:f,data:csv}).then(function(){estado('Respaldo descargado ✓');marcarRespaldo()});
    }).catch(function(e){if(e&&e.code==='declined')return;aviso('No se pudo descargar el respaldo.')});
  };
  $('cc').onclick=function(){$('form').classList.add('hide');$('fn').value='';$('ft').value=''};
  $('gc').onclick=function(){
    var n=$('fn').value.trim();if(!n){estado('Escribí un nombre para guardar');$('fn').focus();return}
    var id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    var c={id:id,nombre:n,telefono:$('ft').value.trim(),movimientos:[]};
    $('cc').onclick();abierto=id;clientes.push(c);render();guardar(c);
  };
  $('lista').addEventListener('click',function(e){
    var t=e.target,b=t.closest('button'),top=t.closest('[data-t]');
    if(b&&b.dataset.a){
      var id=b.dataset.c,c=buscarCliente(id);
      var mi=document.querySelector('[data-m="'+id+'"]'),ni=document.querySelector('[data-n="'+id+'"]');
      var monto=parseFloat(String(mi.value).replace(',','.'));
      if(!(monto>0)){mi.focus();return}
      c.movimientos=(c.movimientos||[]).concat([{id:'m'+Date.now().toString(36),tipo:b.dataset.a,monto:monto,nota:ni.value.trim(),fecha:fechaElegida(id)}]);
      render();guardar(c);return;
    }
    if(b&&b.dataset.dm){
      if(armado!=='m'+b.dataset.dm){armar('m'+b.dataset.dm);return}armado=null;var c2=buscarCliente(b.dataset.c);
      c2.movimientos=c2.movimientos.filter(function(m){return m.id!==b.dataset.dm});render();guardar(c2);return;
    }
    if(b&&b.dataset.hd){var ch=buscarCliente(b.dataset.hd),e1=document.querySelector('[data-d="'+b.dataset.hd+'"]'),e2=document.querySelector('[data-h="'+b.dataset.hd+'"]'),v1=e1?e1.value:'',v2=e2?e2.value:'';if(v1&&v2&&v1>v2){estado('La fecha "desde" es posterior a "hasta"');return}if(ch)bajarHoja(ch,v1,v2);return}
    if(b&&b.dataset.ec){
      editando=b.dataset.ec;render();var ei=document.querySelector('[data-en]');if(ei)ei.focus();return;
      
      
    }
    if(b&&b.dataset.es){var c3=buscarCliente(b.dataset.es),ni3=document.querySelector('[data-en]'),nt3=document.querySelector('[data-et]');if(c3&&ni3){c3.nombre=ni3.value.trim()||c3.nombre;c3.telefono=nt3?nt3.value.trim():c3.telefono;editando=null;render();guardar(c3)}return}
    if(b&&b.dataset.ex){editando=null;render();return}
    if(b&&b.dataset.bc){
      if(armado!=='c'+b.dataset.bc){armar('c'+b.dataset.bc);return}armado=null;var c4=buscarCliente(b.dataset.bc);
      clientes=clientes.filter(function(x){return x.id!==c4.id});abierto=null;render();estado('Guardando…');
      enCola(c4.id,function(){return coleccion.doc(c4.id).delete()}).then(okGuardado,function(){estado('');gtxt('⚠ Sin guardar');aviso('No se pudo borrar.');resync()});return;
    }
    if(top&&!b){abierto=abierto===top.dataset.t?null:top.dataset.t;editando=null;armado=null;render()}
  });

  render();
  var DL={save:function(o){var b=new Blob([o.data],{type:/\.csv$/.test(o.filename)?'text/csv;charset=utf-8':'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1500);return Promise.resolve()}};
  var EF={'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'Correo o contraseña incorrectos.','auth/invalid-email':'El correo no es válido.','auth/too-many-requests':'Demasiados intentos. Esperá unos minutos.','auth/network-request-failed':'No hay conexión a internet.'};
  function arrancar(cb){
    if(typeof firebase==='undefined'||!window.FIREBASE_CONFIG||/PEGAR/.test(FIREBASE_CONFIG.apiKey||'PEGAR')){aviso('Falta configurar Firebase: abrí el archivo firebase-config.js y pegá los datos de tu proyecto.');return}
    firebase.initializeApp(FIREBASE_CONFIG);var fs=firebase.firestore(),au=firebase.auth(),lg=$('login'),ya=false;
    $('lok').onclick=function(){$('lmsg').textContent='';au.signInWithEmailAndPassword($('lc').value.trim(),$('lp').value).catch(function(e){$('lmsg').textContent=EF[e.code]||'No se pudo ingresar.'})};
    $('lp').onkeydown=function(e){if(e.key==='Enter')$('lok').click()};
    $('salir').onclick=function(){au.signOut().then(function(){location.reload()})};
    au.onAuthStateChanged(function(u){
      if(!u){lg.classList.remove('hide');return}
      fs.doc('usuarios/'+u.uid).get().then(function(sn){
        if(!sn.exists){lg.classList.remove('hide');$('lmsg').textContent='Este usuario todavía no tiene permiso para entrar.';return}
        lg.classList.add('hide');if(ya)return;ya=true;cb(fs)
      }).catch(function(){lg.classList.remove('hide');$('lmsg').textContent='No se pudo verificar el permiso. Revisá la conexión.'})
    });
  }
  arrancar(function(d){
    db=d;coleccion=db.collection('clientes');document.body.classList.remove('sindb');
    try{db.collection('meta').doc('respaldo').onSnapshot(function(s){var v=s.exists&&s.data();ultimoResp=v?v.ultimo:null;metaLista=true;pintarRec()},function(){metaLista=true;pintarRec()})}catch(x){metaLista=true}
    coleccion.onSnapshot(function(snap){
      var out=snap.docs.map(function(doc){return Object.assign({},doc.data(),{id:doc.id})});
      clientes=out;
      var foco=document.activeElement;
      if(foco&&foco.tagName==='INPUT'&&foco.closest('#lista')){return}
      render();
    },function(e){aviso('Error al leer los datos: '+(e&&e.message||'desconocido'))});
  });
})();
</script>
